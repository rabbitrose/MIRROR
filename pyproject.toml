[project]
name = "mirror-personalization"
version = "0.1.0"
description = "Training and evaluation code for LLM personalization"
requires-python = ">=3.10,<3.12"
dependencies = [
    "vllm==0.19.1",
    "rouge-score",
    "sacrebleu",
    "rank-bm25",
    "pyarrow",
    "bert-score",
    "transformers>=4.56,<5",
    "peft>=0.17,<0.19",
    "langdetect>=1.0.9",
    "datasets>=5.0.1",
    "nvidia-cutlass-dsl>=4.4,<4.5",
]

[tool.uv]
index-url = "https://mirrors.cloud.tencent.com/pypi/simple"
